<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מי עושה מה – בוגרי השיעור</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06061a;--bg2:#0c0b28;--ink:#ECEBFF;--muted:#9a97c9;--line:rgba(160,150,255,.16);
  --violet:#8b5cf6;--violet2:#a78bfa;--cyan:#22d3ee;--ember:#ff6a2b;--gold:#fbbf24;--green:#34d399;
  --glass:rgba(22,20,58,.55);--r:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--violet);color:#fff}

/* ---------- רקע חי (קבוע, לא זז בגלילה) ---------- */
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;touch-action:pan-y}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60vmax 40vmax at 85% -10%,rgba(139,92,246,.22),transparent 60%),
             radial-gradient(50vmax 40vmax at -10% 110%,rgba(34,211,238,.12),transparent 60%)}
main{position:relative;z-index:1;max-width:1320px;margin:auto;padding:0 22px 90px}

/* ---------- כותרת קופצת ---------- */
.hero{min-height:74vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 0 30px}
.eyebrow{display:inline-flex;gap:10px;align-items:center;font-weight:700;letter-spacing:.18em;font-size:13px;color:var(--violet2);border:1px solid var(--line);padding:7px 16px;border-radius:999px;background:rgba(139,92,246,.08);backdrop-filter:blur(6px)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font-family:Rubik,Heebo,sans-serif;font-weight:900;font-size:clamp(4rem,15vw,13rem);line-height:.9;margin:.25em 0 .1em;letter-spacing:-.02em;user-select:none;cursor:default;touch-action:pan-y;
  white-space:nowrap}
h1 .w{display:inline-block;white-space:nowrap}
h1 .sp{display:inline-block;width:.28em}
h1 .c{display:inline-block;will-change:transform;transform-origin:50% 85%;
  background:linear-gradient(180deg,#fff 20%,#c7c2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .c.hot{background:linear-gradient(180deg,#ffd27a,var(--ember) 70%);-webkit-background-clip:text;background-clip:text}
.lead{font-size:clamp(1.05rem,2vw,1.35rem);color:var(--muted);max-width:640px;margin:10px auto 0}
.lead b{color:var(--ink);font-weight:700}
.scrollhint{margin-top:42px;width:26px;height:42px;border:2px solid var(--line);border-radius:14px;position:relative}
.scrollhint::after{content:"";position:absolute;top:8px;left:50%;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--violet2);animation:sh 1.6s infinite}
@keyframes sh{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}

/* ---------- מונים ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:10px 0 28px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 18px;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.stat b{display:block;font-family:Rubik;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px;font-weight:500}
.stat::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--c,var(--violet))}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ---------- סרגל סינון ---------- */
.bar{position:sticky;top:12px;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px;border-radius:20px;
  background:rgba(12,11,40,.72);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(140%);box-shadow:0 20px 50px -20px rgba(0,0,0,.7);margin-bottom:26px}
.seg{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.seg button{border:1px solid transparent;background:rgba(255,255,255,.04);padding:9px 14px;border-radius:13px;cursor:pointer;font-weight:600;color:var(--muted);transition:.25s;display:inline-flex;gap:8px;align-items:center}
.seg button em{font-style:normal;font-size:12px;font-weight:800;background:rgba(255,255,255,.08);padding:1px 8px;border-radius:99px;color:var(--ink)}
.seg button:hover{color:var(--ink);border-color:var(--line)}
.seg button[aria-pressed=true]{color:#fff;background:linear-gradient(135deg,var(--violet),#6d28d9);box-shadow:0 8px 24px -8px rgba(139,92,246,.9)}
.seg button[aria-pressed=true] em{background:rgba(255,255,255,.22)}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;height:44px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:0 42px 0 14px;outline:none;transition:.2s}
.search input:focus{border-color:var(--violet2);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.search svg{position:absolute;right:13px;top:12px;opacity:.6}
.tool{height:44px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:0 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.tool:hover{color:var(--ink);border-color:var(--violet2)}

/* ---------- קוביות ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:18px;perspective:1200px}
.card{position:relative;border-radius:var(--r);padding:1px;cursor:pointer;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .4s;
  background:linear-gradient(var(--a,140deg),rgba(167,139,250,.55),rgba(34,211,238,.18) 40%,rgba(255,255,255,.04) 70%);
  opacity:0;transform:translateY(24px) scale(.97)}
.card.shown{opacity:1;transform:none}
.card:hover{z-index:2}
.card .in2{position:relative;height:100%;border-radius:calc(var(--r) - 1px);background:linear-gradient(180deg,rgba(20,18,54,.92),rgba(10,9,32,.94));overflow:hidden;padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px}
.card .spot{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(139,92,246,.22),transparent 60%)}
.card:hover .spot{opacity:1}
.logo{position:relative;aspect-ratio:16/8;border-radius:15px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px dashed rgba(167,139,250,.28)}
.logo.has{border-style:solid;border-color:rgba(255,255,255,.08)}
.logo.light{background:linear-gradient(160deg,#ffffff,#eceaf7)}
.logo.dark{background:linear-gradient(160deg,#17153a,#0b0a22)}
.logo img{max-width:82%;max-height:74%;object-fit:contain;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18));transition:transform .4s}
.card:hover .logo img{transform:scale(1.06)}
.logo .ph{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12.5px;font-weight:500;opacity:.75}
.logo .ph svg{opacity:.7}
.who{display:flex;align-items:center;gap:11px;margin-top:-30px;padding:0 4px;position:relative}
.av{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-family:Rubik;font-weight:800;font-size:19px;color:#fff;
  background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:0 0 0 4px #0f0e30,0 10px 24px -8px var(--h1)}
.nm{padding-top:26px;min-width:0}
.nm h3{margin:0;font-size:18px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:13px;padding:9px 10px}
.slot .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:rgba(255,255,255,.05)}
.slot .t{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;display:flex;gap:6px;align-items:center}
.slot .d{font-size:14.5px;font-weight:600;line-height:1.35;margin-top:1px;word-break:break-word}
.slot .d.empty{color:rgba(154,151,201,.55);font-weight:400;font-style:italic}
.chip{font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;letter-spacing:0}
.chip.learn{background:rgba(251,191,36,.15);color:var(--gold)}
.chip.work{background:rgba(34,211,238,.14);color:var(--cyan)}
.chip.other{background:rgba(167,139,250,.16);color:var(--violet2)}
.card .edit{position:absolute;top:22px;left:22px;z-index:3;width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:rgba(10,9,32,.7);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:.25s;color:#fff}
.card:hover .edit,.card:focus-visible .edit{opacity:1;transform:none}
@media(hover:none){.card .edit{opacity:1;transform:none}}
.none{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)}

/* ---------- חלון עריכה ---------- */
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(3,3,14,.6);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
.dlg.open{opacity:1;pointer-events:auto}
.box{width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:24px;background:linear-gradient(180deg,#15133a,#0b0a24);border:1px solid var(--line);box-shadow:0 40px 100px -20px rgba(0,0,0,.8),0 0 0 1px rgba(139,92,246,.15);padding:22px;transform:translateY(16px) scale(.98);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.dlg.open .box{transform:none}
.box h2{margin:0 0 2px;font-family:Rubik;font-size:26px}
.box .sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.fs{border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;margin:0 0 12px}
.fs legend{padding:0 6px;font-weight:700;font-size:14px}
.radio{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.radio label{cursor:pointer}
.radio input{position:absolute;opacity:0;pointer-events:none}
.radio span{display:inline-block;padding:7px 14px;border-radius:11px;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);transition:.2s}
.radio input:checked+span{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--violet),#6d28d9)}
.radio input:focus-visible+span{outline:2px solid var(--cyan)}
.in{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:0 12px;outline:none}
.in:focus{border-color:var(--violet2);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
.drop{border:1.5px dashed rgba(167,139,250,.45);border-radius:16px;padding:14px;display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;cursor:pointer;transition:.2s}
.drop.over{border-color:var(--cyan);background:rgba(34,211,238,.06)}
.drop .logo{aspect-ratio:16/9}
.drop p{margin:0;font-size:14px;color:var(--muted)}
.drop p b{color:var(--ink)}
@media(max-width:480px){.drop{grid-template-columns:1fr}}
.bgopt{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.btn{height:46px;border:0;border-radius:13px;padding:0 20px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--violet),#6d28d9);color:#fff;box-shadow:0 10px 24px -10px rgba(139,92,246,.9)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{background:transparent;border:1px solid rgba(255,106,43,.4);color:var(--ember);box-shadow:none}
textarea.in{height:160px;padding:10px;direction:ltr;font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);opacity:0;z-index:60;background:#fff;color:#14122f;font-weight:700;padding:11px 20px;border-radius:999px;transition:.3s;pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:13px;padding:0 0 40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card{opacity:1;transform:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&display=swap">
<style>
/* ===== עיצוב קוביות v2: ריבוע, מונוכרום, גופן טכנולוגי, אייקונים דקים ===== */
body,.card,.card *{font-family:'IBM Plex Sans Hebrew',Heebo,system-ui,sans-serif}
.grid{gap:16px;perspective:none}
.card{border-radius:16px;padding:1px;aspect-ratio:1/1;transform:none!important;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 60%);transition:background .35s,box-shadow .35s,opacity .4s}
.card:hover{background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.06) 70%);box-shadow:0 24px 48px -24px rgba(0,0,0,.9)}
@keyframes tickle{0%,100%{translate:0 0}30%{translate:0 -2px}60%{translate:0 1px}}
.card:hover{animation:tickle .6s ease-in-out}
.card .in2{border-radius:15px;background:linear-gradient(180deg,#131318,#0b0b0f);padding:0;gap:0}
.card .spot{background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.045),transparent 60%)}
.logo{aspect-ratio:auto;flex:1 1 0;min-height:96px;border-radius:0;border:0!important;border-bottom:1px solid rgba(255,255,255,.07)!important;background:#17171d!important}
.logo::before{content:"";position:absolute;inset:-30px;background:var(--lg,none) center/cover no-repeat;filter:blur(24px) saturate(.7) brightness(.6);opacity:.95}
.logo img{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;padding:10px;filter:none;transform:none!important}
.logo.fill img{object-fit:cover;padding:0}
.logo.fill::before{display:none}
.logo .ph{font-weight:300;font-size:11.5px;letter-spacing:.04em;color:rgba(255,255,255,.35)}
.who{margin:0;padding:12px 14px 0;gap:10px}
.av{width:34px;height:34px;border-radius:9px;font-family:inherit;font-weight:500;font-size:12.5px;letter-spacing:.03em;color:#e8e8ee;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);box-shadow:none}
.nm{padding-top:0}
.nm h3{font-size:15.5px;font-weight:600;letter-spacing:-.005em;color:#f2f2f6}
.nm small{font-size:11.5px;font-weight:300;color:rgba(255,255,255,.42)}
.slots{grid-template-columns:1fr 1fr;gap:0;padding:12px 14px 14px}
.slot{background:none;border:0;border-radius:0;padding:0;padding-inline-end:10px;grid-template-columns:15px 1fr;gap:7px;min-width:0}
.slot+.slot{border-inline-start:1px solid rgba(255,255,255,.08);padding-inline:10px 0}
.slot .ic{width:15px;height:15px;border-radius:0;font-size:0;margin-top:2px;background:rgba(255,255,255,.6);
  -webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat}
.slot:nth-child(1) .ic{--ico:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'1.4'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Cpath%20d%3D'M2%2019h20M6.5%2019a5.5%205.5%200%200%201%2011%200M12%203v6M9%206l3-3%203%203M4.2%2012.2l1.4%201.4M19.8%2012.2l-1.4%201.4'%2F%3E%3C%2Fsvg%3E")}
.slot:nth-child(2) .ic{--ico:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'1.4'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D'12'%20cy%3D'12'%20r%3D'4.2'%2F%3E%3Cpath%20d%3D'M12%202.5v2M12%2019.5v2M2.5%2012h2M19.5%2012h2M5.3%205.3l1.4%201.4M17.3%2017.3l1.4%201.4M5.3%2018.7l1.4-1.4M17.3%206.7l1.4-1.4'%2F%3E%3C%2Fsvg%3E")}
.slot .t{font-size:10.5px;font-weight:400;letter-spacing:.06em;color:rgba(255,255,255,.4)}
.slot .d{font-size:13px;font-weight:500;color:#ececf2;overflow:hidden;text-overflow:ellipsis}
.slot .d.empty{color:rgba(255,255,255,.26);font-weight:300;font-style:normal}
.chip{background:none!important;border:1px solid rgba(255,255,255,.14)!important;color:rgba(255,255,255,.55)!important;font-weight:400!important;font-size:9.5px!important;padding:0 6px!important;border-radius:20px!important;box-shadow:none!important}
</style>
<style>
/* ===== גלילה יוקרתית ואיטית (Lenis) + חשיפת קוביות בגלילה ===== */
html{scroll-behavior:auto!important}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-stopped{overflow:hidden}
.card{transition:background .35s,box-shadow .35s,opacity 1.1s cubic-bezier(.16,1,.3,1),translate 1.4s cubic-bezier(.16,1,.3,1),filter 1.1s cubic-bezier(.16,1,.3,1)}
.card:not(.shown){opacity:0;translate:0 70px;filter:blur(8px)}
@media (prefers-reduced-motion:reduce){.card:not(.shown){translate:none;filter:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas><div class="glow"></div>

<main>
  <header class="hero">
    <span class="eyebrow"><i></i>בוגרי ישמח לב · שיעור ד׳</span>
    <h1 id="title" aria-label="מי עושה מה">מי עושה מה</h1>
    <p class="lead">כל החברים מהשיעור, <b>מה כל אחד עושה בבוקר ומה בצהריים</b> – במקום אחד. לחצו על קובייה כדי לעדכן ולהעלות לוגו.</p>
    <div class="scrollhint" aria-hidden="true"></div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="bar">
    <div class="seg" id="seg" role="group" aria-label="סינון"></div>
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="חיפוש לפי שם, חברה או מקום…" autocomplete="off"></label>
    <button class="tool" id="dataBtn" title="גיבוי והעברת נתונים">גיבוי נתונים</button>
  </div>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>
<footer>אסאך שמחות · טיוטה לתצוגה, לפני העלאה לאתר</footer>

<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dTitle"><form class="box" id="form" autocomplete="off"></form></div>
<div class="dlg" id="dlg2" role="dialog" aria-modal="true" aria-labelledby="d2Title"><div class="box" id="box2"></div></div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
(function(){

/* לוגו: חיתוך שוליים ריקים, הקטנה, שמירה */
function takeFile(f){
  if(!/^image\//.test(f.type)){ toast('זה לא קובץ תמונה'); return; }
  var url=URL.createObjectURL(f), img=new Image();
  img.onload=function(){ try{
    var W=img.naturalWidth, H=img.naturalHeight, sc=Math.min(1,900/Math.max(W,H)); W=Math.max(1,Math.round(W*sc)); H=Math.max(1,Math.round(H*sc));
    var c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d'); x.drawImage(img,0,0,W,H);
    var d=x.getImageData(0,0,W,H).data, bg=[d[0],d[1],d[2],d[3]];
    function diff(i){ if(bg[3]<20) return d[i+3]>20; if(d[i+3]<20) return true; return Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2])>48; }
    var x0=W,y0=H,x1=-1,y1=-1; for(var yy=0;yy<H;yy++) for(var xx=0;xx<W;xx++){ if(diff((yy*W+xx)*4)){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy; } }
    if(x1<0){ x0=0;y0=0;x1=W-1;y1=H-1; }
    var pad=Math.round(Math.max(x1-x0,y1-y0)*.04); x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(W-1,x1+pad); y1=Math.min(H-1,y1+pad);
    var cw=x1-x0+1, ch=y1-y0+1, s2=Math.min(1,420/Math.max(cw,ch)), o=document.createElement('canvas'); o.width=Math.round(cw*s2); o.height=Math.round(ch*s2);
    o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,o.width,o.height);
    var out=o.toDataURL('image/webp',.86); if(out.indexOf('data:image/webp')!==0) out=o.toDataURL('image/png');
    /* בחירה אוטומטית של רקע: לוגו בהיר על רקע כהה */
    var od=o.getContext('2d').getImageData(0,0,o.width,o.height).data, L=0, n=0; for(var i=0;i<od.length;i+=16){ if(od[i+3]>40){ L+=.3*od[i]+.59*od[i+1]+.11*od[i+2]; n++; } }
    if(bg[3]<20&&n) DRAFT.lbg=(L/n)>190?'dark':'light'; else DRAFT.lbg='light';
    DRAFT.logo=out; var r2=$('#form input[name=lbg][value='+DRAFT.lbg+']'); if(r2) r2.checked=true; refreshLogo(); toast('הלוגו הותאם למסגרת');
  }catch(e){ toast('לא הצלחתי לקרוא את התמונה'); } URL.revokeObjectURL(url); };
  img.onerror=function(){ toast('לא הצלחתי לקרוא את התמונה'); URL.revokeObjectURL(url); };
  img.src=url;
}

    Array.from(word).forEach(function(ch){ var s=document.createElement('span'); s.className='c'; s.textContent=ch; w.appendChild(s); C.push({el:s,y:0,vy:0,r:0,vr:0,s:1,vs:0,ty:0,tr:0,ts:1}); });
    h.appendChild(w);
  });
  if(reduce) return;
  var px=-9999, py=-9999, active=false;
  function move(e){ px=e.clientX; py=e.clientY; active=true; }
  h.addEventListener('pointermove',move); h.addEventListener('pointerdown',function(e){ move(e); C.forEach(function(c){ c.vy-=6*Math.random(); c.vr+=(Math.random()-.5)*10; }); });
  window.addEventListener('pointermove',function(e){ if(!h.contains(e.target)){ px=e.clientX; py=e.clientY; } });
  h.addEventListener('pointerleave',function(){ active=false; });
  /* אנימציית פתיחה: האותיות נוחתות */
  C.forEach(function(c,i){ c.y=-120-i*14; c.r=(i%2?1:-1)*25; c.s=.6; });
  function tick(){
    C.forEach(function(c,i){
      var b=c.el.getBoundingClientRect(), cx=b.left+b.width/2, cy=b.top+b.height/2, dx=px-cx, dy=py-cy, d=Math.sqrt(dx*dx+dy*dy), R=Math.max(90,b.width*1.6);
      var k=d<R?1-d/R:0; k=k*k*(3-2*k);
      c.ty=-k*b.height*.32; c.tr=(dx>0?-1:1)*k*16; c.ts=1+k*.32;
      c.el.classList.toggle('hot',k>.25);
      /* קפיץ */
      c.vy+=(c.ty-c.y)*.16; c.vy*=.72; c.y+=c.vy;
      c.vr+=(c.tr-c.r)*.14; c.vr*=.7; c.r+=c.vr;
      c.vs+=(c.ts-c.s)*.18; c.vs*=.68; c.s+=c.vs;
      c.el.style.transform='translateY('+c.y.toFixed(2)+'px) rotate('+c.r.toFixed(2)+'deg) scale('+c.s.toFixed(3)+','+(c.s*(1-(c.vy*.004))).toFixed(3)+')';
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ---------- רקע: רשת חיה שמגיבה למגע ---------- */
(function(){
  var cv=$('#bg'), x=cv.getContext('2d'), W,H,DPR, P=[], mouse={x:-9999,y:-9999,on:false}, waves=[];
  function size(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; x.setTransform(DPR,0,0,DPR,0,0);
    var n=Math.round(Math.min(140,Math.max(45,W*H/11000)));
    while(P.length<n) P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6,h:Math.random()});
    P.length=n; }
  size(); addEventListener('resize',size);
  addEventListener('pointermove',function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.on=true; },{passive:true});
  addEventListener('pointerdown',function(e){ waves.push({x:e.clientX,y:e.clientY,r:0}); mouse.x=e.clientX; mouse.y=e.clientY; mouse.on=true; },{passive:true});
  document.addEventListener('pointerleave',function(){ mouse.on=false; });
  addEventListener('touchend',function(){ setTimeout(function(){ mouse.on=false; },600); },{passive:true});
  var LINK=150;
  function frame(){
    x.clearRect(0,0,W,H);
    for(var w=waves.length-1;w>=0;w--){ var wv=waves[w]; wv.r+=7; var a=1-wv.r/420; if(a<=0){ waves.splice(w,1); continue; }
      x.beginPath(); x.arc(wv.x,wv.y,wv.r,0,6.283); x.strokeStyle='rgba(167,139,250,'+(a*.5)+')'; x.lineWidth=1.5; x.stroke(); }
    for(var i=0;i<P.length;i++){ var p=P[i];
      if(mouse.on){ var dx=mouse.x-p.x, dy=mouse.y-p.y, d2=dx*dx+dy*dy; if(d2<200*200){ var f=(1-Math.sqrt(d2)/200)*.035; p.vx+=dx*f*.02; p.vy+=dy*f*.02; } }
      waves.forEach(function(wv){ var dx=p.x-wv.x, dy=p.y-wv.y, d=Math.sqrt(dx*dx+dy*dy)||1; if(Math.abs(d-wv.r)<30){ p.vx+=dx/d*.6; p.vy+=dy/d*.6; } });
      p.vx*=.985; p.vy*=.985; var sp=Math.hypot(p.vx,p.vy); if(sp<.12){ p.vx+=(Math.random()-.5)*.05; p.vy+=(Math.random()-.5)*.05; } if(sp>2.4){ p.vx*=.9; p.vy*=.9; }
      p.x+=p.vx; p.y+=p.vy; if(p.x<-20) p.x=W+20; if(p.x>W+20) p.x=-20; if(p.y<-20) p.y=H+20; if(p.y>H+20) p.y=-20; }
    x.lineWidth=.8;
    for(i=0;i<P.length;i++){ var a1=P[i];
      for(var j=i+1;j<P.length;j++){ var b=P[j], ddx=a1.x-b.x, ddy=a1.y-b.y, dd=ddx*ddx+ddy*ddy; if(dd<LINK*LINK){ var o=(1-Math.sqrt(dd)/LINK)*.5; x.strokeStyle='rgba(124,104,255,'+o+')'; x.beginPath(); x.moveTo(a1.x,a1.y); x.lineTo(b.x,b.y); x.stroke(); } }
      if(mouse.on){ var mx=a1.x-mouse.x, my=a1.y-mouse.y, md=mx*mx+my*my; if(md<190*190){ var mo=(1-Math.sqrt(md)/190); x.strokeStyle='rgba(34,211,238,'+(mo*.7)+')'; x.beginPath(); x.moveTo(a1.x,a1.y); x.lineTo(mouse.x,mouse.y); x.stroke(); } }
    }
    for(i=0;i<P.length;i++){ var q=P[i]; x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fillStyle=q.h>.8?'rgba(34,211,238,.9)':'rgba(167,139,250,.85)'; x.fill(); }
    if(mouse.on){ x.beginPath(); x.arc(mouse.x,mouse.y,3,0,6.283); x.fillStyle='rgba(34,211,238,.9)'; x.fill(); }
    if(!reduce) requestAnimationFrame(frame);
  }
  frame();
})();

renderAll();
})();
</script>

(function(){function fit(i){var l=i.parentElement,w=l.clientWidth,h=l.clientHeight;if(!i.naturalWidth||!h)return;var r=(i.naturalWidth/i.naturalHeight)/(w/h);l.classList.toggle('fill',r>0.88&&r<1.14)}function f(){document.querySelectorAll('.logo img').forEach(function(i){var l=i.parentElement;if(l.dataset.bg!==i.src){l.dataset.bg=i.src;l.style.setProperty('--lg','url("'+i.src+'")')}if(i.complete)fit(i);else i.onload=function(){fit(i)}})}f();new MutationObserver(f).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});addEventListener('resize',f)})();

 prevent:function(n){return !!(n.closest&&n.closest('.box'))}});

stag();new MutationObserver(stag).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class'],childList:true});
})();
