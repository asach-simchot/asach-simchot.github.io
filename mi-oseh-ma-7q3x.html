<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מי עושה מה – בוגרי השיעור</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05050c;--ink:#f2f2f7;--muted:#8a8aa3;--dim:#5b5b72;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --acc:#a99bff;--acc2:#7c6cff;--glass:rgba(16,16,28,.6);--r:18px;
  --sans:"IBM Plex Sans Hebrew",system-ui,sans-serif;--mono:"JetBrains Mono","IBM Plex Sans Hebrew",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--acc2);color:#fff}

/* ---------- רקע ---------- */
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;touch-action:pan-y;opacity:.55}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(70vmax 45vmax at 80% -15%,rgba(124,108,255,.16),transparent 60%),
             radial-gradient(60vmax 40vmax at 0% 120%,rgba(124,108,255,.07),transparent 60%)}
main{position:relative;z-index:1;max-width:1320px;margin:auto;padding:0 24px 100px}

/* ---------- כותרת ---------- */
.hero{min-height:72vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 0 30px}
.eyebrow{display:inline-flex;gap:10px;align-items:center;font-family:var(--mono);font-weight:400;letter-spacing:.08em;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.02);backdrop-filter:blur(6px)}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:pulse 2.2s infinite}
@keyframes pulse{50%{opacity:.3}}
h1{font-family:var(--sans);font-weight:700;font-size:clamp(3.6rem,13vw,11rem);line-height:.95;margin:.3em 0 .15em;letter-spacing:-.045em;user-select:none;cursor:default;touch-action:pan-y;white-space:nowrap}
h1 .w{display:inline-block;white-space:nowrap}
h1 .sp{display:inline-block;width:.24em}
h1 .c{display:inline-block;will-change:transform;transform-origin:50% 85%;
  background:linear-gradient(180deg,#ffffff 30%,#9e9eb8);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .c.hot{background:linear-gradient(180deg,#fff,var(--acc) 80%);-webkit-background-clip:text;background-clip:text}
.lead{font-size:clamp(1rem,1.8vw,1.2rem);font-weight:300;color:var(--muted);max-width:600px;margin:12px auto 0;line-height:1.6}
.lead b{color:var(--ink);font-weight:500}
.scrollhint{margin-top:46px;width:1px;height:48px;background:linear-gradient(var(--line2),transparent);position:relative;overflow:hidden}
.scrollhint::after{content:"";position:absolute;top:-16px;left:0;width:1px;height:16px;background:var(--acc);animation:sh 2s infinite}
@keyframes sh{to{transform:translateY(64px)}}

/* ---------- מונים ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:10px 0 28px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:rgba(10,10,20,.88);padding:20px 22px;backdrop-filter:blur(10px)}
.stat b{display:block;font-family:var(--mono);font-size:clamp(1.8rem,3.6vw,2.5rem);font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat span{display:block;margin-top:8px;color:var(--muted);font-size:13px;font-weight:400}
.stat:first-child b{color:var(--acc)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ---------- סרגל סינון ---------- */
.bar{position:sticky;top:12px;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px;border-radius:16px;
  background:rgba(8,8,16,.78);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 20px 50px -24px rgba(0,0,0,.8);margin-bottom:26px}
.seg{display:flex;flex-wrap:wrap;gap:2px;position:relative}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:400;font-size:14px;color:var(--muted);transition:.2s;display:inline-flex;gap:8px;align-items:center}
.seg button em{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dim)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{color:var(--ink);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button[aria-pressed=true] em{color:var(--acc)}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.02);padding:0 40px 0 14px;outline:none;transition:.2s;font-weight:300}
.search input:focus{border-color:var(--line2);background:rgba(255,255,255,.04)}
.search svg{position:absolute;right:13px;top:11px;opacity:.45}
.tool{height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;padding:0 14px;cursor:pointer;font-weight:400;font-size:14px;color:var(--muted)}
.tool:hover{color:var(--ink);border-color:var(--line2)}

/* ---------- קוביות ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;aspect-ratio:1/1;border-radius:var(--r);cursor:pointer;overflow:hidden;isolation:isolate;
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012) 60%),rgba(9,9,18,.9);
  border:1px solid var(--line);opacity:0;transition:opacity .5s,border-color .3s,box-shadow .3s;
  display:flex;flex-direction:column;justify-content:space-between;padding:20px}
.card.shown{opacity:1}
.card:hover,.card:focus-visible{border-color:var(--line2);box-shadow:0 24px 60px -30px rgba(124,108,255,.55);outline:none}
.card .spot{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(169,155,255,.10),transparent 65%)}
.card:hover .spot{opacity:1}
.card .bgimg{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover .bgimg{transform:scale(1.04)}
.card.img::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,5,12,.15) 0%,rgba(5,5,12,0) 25%,rgba(5,5,12,.62) 50%,rgba(5,5,12,.95) 100%)}
.card.img{border-color:rgba(255,255,255,.12)}
.top{display:flex;justify-content:space-between;align-items:center}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--sans);font-weight:500;font-size:15px;color:var(--ink);
  border:1px solid var(--line2);background:rgba(255,255,255,.03)}
.card.img .av{background:rgba(5,5,12,.45);backdrop-filter:blur(8px);border-color:rgba(255,255,255,.22)}
.idx{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.05em}
.card.img .idx{color:rgba(255,255,255,.7)}
.nm h3{margin:0;font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:13px;font-weight:300;display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.3em}
.card.img .nm small{color:rgba(255,255,255,.72)}
.slots{display:grid;margin-top:14px;border-top:1px solid var(--line)}
.card.img .slots{border-color:rgba(255,255,255,.14)}
.slot{display:grid;grid-template-columns:16px 52px 1fr;gap:10px;align-items:start;padding:9px 0 0;min-width:0}
.slot svg{margin-top:2px}
.slot svg{color:var(--muted);display:block}
.slot .t{font-size:12px;color:var(--muted);font-weight:300}
.slot .d{font-size:14px;font-weight:400;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0}
.slot .d.empty{color:var(--dim);font-weight:300}
.slot .d i{font-style:normal;color:var(--acc);font-weight:400}
.card.img .slot svg,.card.img .slot .t{color:rgba(255,255,255,.7)}
.card.img .slot .d.empty{color:rgba(255,255,255,.45)}
.card .edit{position:absolute;top:20px;left:20px;z-index:3;width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:rgba(5,5,12,.55);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;transition:.25s;color:#fff}
.card:hover .edit,.card:focus-visible .edit{opacity:1}
.card:hover .idx,.card:focus-visible .idx{opacity:0}
@media(hover:none){.card .edit{opacity:1}.card .idx{opacity:0}}
.none{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted);font-weight:300}

/* ---------- חלון עריכה ---------- */
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(2,2,8,.66);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .25s}
.dlg.open{opacity:1;pointer-events:auto}
.box{width:min(540px,100%);max-height:92vh;overflow:auto;border-radius:20px;background:#0b0b15;border:1px solid var(--line2);box-shadow:0 40px 100px -20px rgba(0,0,0,.85);padding:24px;transform:translateY(14px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.dlg.open .box{transform:none}
.box h2{margin:0 0 2px;font-size:24px;font-weight:600;letter-spacing:-.01em}
.box .sub{margin:0 0 18px;color:var(--muted);font-size:14px;font-weight:300}
.fs{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:0 0 12px}
.fs legend{padding:0 6px;font-weight:500;font-size:13px;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.radio{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.radio label{cursor:pointer}
.radio input{position:absolute;opacity:0;pointer-events:none}
.radio span{display:inline-block;padding:6px 13px;border-radius:9px;border:1px solid var(--line);font-weight:400;font-size:13.5px;color:var(--muted);transition:.2s}
.radio input:checked+span{color:var(--ink);border-color:var(--acc);background:rgba(169,155,255,.1)}
.radio input:focus-visible+span{outline:2px solid var(--acc)}
.in{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.025);padding:0 12px;outline:none;font-weight:300}
.in:focus{border-color:var(--acc)}
.lbl{display:block;font-size:13px;font-weight:400;color:var(--muted);margin:12px 0 6px}
.drop{border:1px dashed var(--line2);border-radius:14px;padding:12px;display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;cursor:pointer;transition:.2s}
.drop.over{border-color:var(--acc);background:rgba(169,155,255,.06)}
.prev{aspect-ratio:1/1;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--dim);font-size:12px}
.prev img{width:100%;height:100%;object-fit:cover;display:block}
.drop p{margin:0;font-size:13.5px;color:var(--muted);font-weight:300;line-height:1.55}
.drop p b{color:var(--ink);font-weight:500}
@media(max-width:480px){.drop{grid-template-columns:96px 1fr}}
.row{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.btn{height:42px;border:0;border-radius:10px;padding:0 20px;font-weight:500;cursor:pointer;background:var(--ink);color:#0b0b15}
.btn:hover{background:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--line2);color:var(--muted);height:34px;padding:0 12px;font-size:13px;margin-top:10px}
.btn.danger:hover{color:#ff8a8a;border-color:rgba(255,138,138,.4)}
textarea.in{height:160px;padding:10px;direction:ltr;font-family:var(--mono);font-size:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);opacity:0;z-index:60;background:var(--ink);color:#0b0b15;font-weight:500;padding:10px 20px;border-radius:999px;transition:.3s;pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{position:relative;z-index:1;text-align:center;color:var(--dim);font-size:12px;font-family:var(--mono);padding:0 0 40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card{opacity:1}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas><div class="glow"></div>

<main>
  <header class="hero">
    <span class="eyebrow"><i></i>בוגרי ישמח לב · שיעור ד׳</span>
    <h1 id="title" aria-label="מי עושה מה">מי עושה מה</h1>
    <p class="lead">כל החברים מהשיעור, <b>מה כל אחד עושה בבוקר ומה בצהריים</b> – במקום אחד. לחצו על קובייה כדי לעדכן ולהעלות לוגו.</p>
    <div class="scrollhint" aria-hidden="true"></div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="bar">
    <div class="seg" id="seg" role="group" aria-label="סינון"></div>
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="חיפוש לפי שם, חברה או מקום…" autocomplete="off"></label>
    <button class="tool" id="dataBtn" title="גיבוי והעברת נתונים">גיבוי נתונים</button>
  </div>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>
<footer>אסאך שמחות · טיוטה לתצוגה, לפני העלאה לאתר</footer>

<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dTitle"><form class="box" id="form" autocomplete="off"></form></div>
<div class="dlg" id="dlg2" role="dialog" aria-modal="true" aria-labelledby="d2Title"><div class="box" id="box2"></div></div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var NAMES=['אביגדור כהנא','אהרן וויזנער','אלטר שמואל אופמאן','אליהו רוזן','אלימלך אדאלף','אלימלך גאנצפריד','אלימלך דירנפלד','אלעזר רוקח','ארי פריעד','אשר אנשיל קארניאל','אשר וועבער','אשר משה פריעד','ברוך העכט','דוד דוויק','דוד טייכמן','דוד מנחם רוזנפעלד','דוד רינגל','דוד שובקס','וואלווי זאבלאצקי','זאב יצחק מייזנער','חיים יענקוביץ','חיים קאטה','יהודה גראסמאן','יהודה שווייצער','יוסף דרעזדנער','יוסף טכובר','יוסף יצחק אסטרייכער','יוסף שארף','יחזקאל מנדל','יחיאל וועבער','יחיאל זאבלאצקי','יחיאל רויטמאן','יעקב אלימלך האניג','יעקב יצחק אונגאר','יצחק ארליך','ישי בערגער','ישי שובקס','ישעי\' גלנדואר','ישעי\' מן','ישעי\' פאללאק','ישראל זאב דוידוביץ','ישראל מרדכי פראנק','ישראל פויגל','ישראל רוטנר','ישראל שלמה קאננער','מאיר נפתלי צבי מנדל','מנחם אוברלנדר','מענדל טרויבע','מרדכי קייסערמאן','משה יוסף וויזל','משה נחום גראס','משה שמואל הלפרט','מתתיהו נתן מאירוביץ','נחמן שוורץ','נפתלי דירנפעלד','נפתלי פירר','עזריאל שפירא','פנחס בלייכפעלד','פנחס קליין','צבי וונגר','קלמן יהודה שפירא','שלום זילבר','שלום יוסף כהן','שלום קוט','שלמה אדלר','שלמה גראס','שלמה זלמן ניימן','שמואל ברגר','שמואל דמן','שמואל פארגעס','שמואל פליישמאן','שמעון אדלר','שמעון גרינוואלד','שמעון רייזמאן'];
var KEY='asach-mi-oseh-ma-v1';
var TYPES={learn:['לומד','learn'],work:['עובד','work'],other:['אחר','other']};
var $=function(s,r){ return (r||document).querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- נתונים ---------- */
var DATA={};
try{ DATA=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ DATA={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DATA)); return true; }catch(e){ toast('הדפדפן לא שמר – אולי התמונה גדולה מדי'); return false; } }
function rec(n){ return DATA[n]||{}; }
function kind(n){ var r=rec(n), a=(r.am&&r.am.t)||'', b=(r.pm&&r.pm.t)||'';
  return {any:!!(a||b), work:a==='work'||b==='work', learn:a==='learn'||b==='learn', full:a==='learn'&&b==='learn', mix:(a==='learn'&&b==='work')||(a==='work'&&b==='learn')}; }
var FILTERS=[['all','כולם',function(){ return true; }],['work','עובדים',function(k){ return k.work; }],['learn','לומדים',function(k){ return k.learn; }],['full','לומדים כל היום',function(k){ return k.full; }],['mix','לומדים ועובדים',function(k){ return k.mix; }],['none','טרם עודכנו',function(k){ return !k.any; }]];
var ST={f:'all',q:''};

/* ---------- צבע אישי לכל שם ---------- */
function hue(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; }
function initials(n){ var w=n.replace(/['׳]/g,'').split(' ').filter(Boolean); return (w[0]||'').charAt(0)+(w.length>1?w[w.length-1].charAt(0):''); }

/* ---------- מונים ---------- */
function renderStats(){
  var c={work:0,learn:0,mix:0}; NAMES.forEach(function(n){ var k=kind(n); if(k.work) c.work++; if(k.learn) c.learn++; if(k.mix) c.mix++; });
  var S=[[NAMES.length,'בוגרים בשיעור'],[c.work,'עובדים'],[c.learn,'לומדים'],[c.mix,'לומדים ועובדים']];
  $('#stats').innerHTML=S.map(function(s){ return '<div class="stat"><b data-to="'+s[0]+'">0</b><span>'+s[1]+'</span></div>'; }).join('');
  [].forEach.call(document.querySelectorAll('#stats b'),function(b){ var to=+b.dataset.to, t0=performance.now();
    (function step(t){ var p=Math.min(1,(t-t0)/900); b.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); })(t0); });
}
function renderSeg(){
  $('#seg').innerHTML=FILTERS.map(function(f){ var n=NAMES.filter(function(x){ return f[2](kind(x)); }).length;
    return '<button data-f="'+f[0]+'" aria-pressed="'+(ST.f===f[0])+'">'+f[1]+'<em>'+n+'</em></button>'; }).join('');
}

/* ---------- קוביות ---------- */
var ICON_LOGO='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>';

function slotHtml(s,label,ic){
  s=s||{}; var ty=TYPES[s.t], txt='';
  if(s.d&&ty) txt='<i>'+ty[0]+'</i> · '+esc(s.d); else if(s.d) txt=esc(s.d); else if(ty) txt='<i>'+ty[0]+'</i>';
  return '<div class="slot">'+ic+'<span class="t">'+label+'</span>'+(txt?'<span class="d">'+txt+'</span>':'<span class="d empty">טרם עודכן</span>')+'</div>';
}
function cardHtml(n,i){
  var r=rec(n), no=NAMES.indexOf(n)+1;
  return '<article class="card'+(r.logo?' img':'')+'" tabindex="0" data-n="'+esc(n)+'" style="transition-delay:'+Math.min(i*20,400)+'ms">'+
    (r.logo?'<img class="bgimg" src="'+r.logo+'" alt="'+esc(r.co||'')+'">':'')+'<div class="spot"></div>'+
    '<div class="top"><div class="av">'+esc(initials(n))+'</div><span class="idx">'+(no<10?'0':'')+no+'</span></div>'+
    '<div><div class="nm"><h3>'+esc(n)+'</h3><small>'+(r.co?esc(r.co):'')+'</small></div>'+
    '<div class="slots">'+slotHtml(r.am,'בבוקר',I_AM)+slotHtml(r.pm,'בצהריים',I_PM)+'</div></div>'+
    '<span class="edit" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></span></article>';
}
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('shown'); io.unobserve(e.target); } }); },{rootMargin:'0px 0px -40px 0px'}):null;
function renderGrid(){
  var f=FILTERS.filter(function(x){ return x[0]===ST.f; })[0][2], q=ST.q.trim();
  var list=NAMES.filter(function(n){ if(!f(kind(n))) return false; if(!q) return true; var r=rec(n);
    return (n+' '+(r.co||'')+' '+((r.am&&r.am.d)||'')+' '+((r.pm&&r.pm.d)||'')).indexOf(q)>=0; });
  $('#grid').innerHTML=list.length?list.map(cardHtml).join(''):'<div class="none">אין כאן אף אחד כרגע</div>';
  [].forEach.call(document.querySelectorAll('.card'),function(c){ if(io&&!reduce) io.observe(c); else c.classList.add('shown'); });
}
function renderAll(){ renderStats(); renderSeg(); renderGrid(); }

/* הטיה תלת-ממדית ואור שעוקב אחרי הסמן */
var grid=$('#grid');
grid.addEventListener('pointermove',function(e){ var c=e.target.closest('.card'); if(!c||reduce||e.pointerType==='touch') return; var b=c.getBoundingClientRect(), x=(e.clientX-b.left)/b.width, y=(e.clientY-b.top)/b.height;
  c.style.setProperty('--mx',x*100+'%'); c.style.setProperty('--my',y*100+'%'); 
  c.style.transitionDelay='0ms'; });
grid.addEventListener('click',function(e){ var c=e.target.closest('.card'); if(c) openEdit(c.dataset.n); });
grid.addEventListener('keydown',function(e){ var c=e.target.closest('.card'); if(c&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openEdit(c.dataset.n); } });

/* ---------- עריכה ---------- */
var CUR=null, DRAFT=null;
function radios(name,val){ return '<div class="radio">'+[['learn','לומד'],['work','עובד'],['other','אחר'],['','לא ידוע']].map(function(o){ return '<label><input type="radio" name="'+name+'" value="'+o[0]+'"'+((val||'')===o[0]?' checked':'')+'><span>'+o[1]+'</span></label>'; }).join('')+'</div>'; }
function logoBox(){ return '<div class="prev" id="dLogo">'+(DRAFT.logo?'<img src="'+DRAFT.logo+'" alt="">':'אין תמונה')+'</div>'; }
function openEdit(n){
  CUR=n; var r=rec(n); DRAFT={am:Object.assign({},r.am),pm:Object.assign({},r.pm),co:r.co||'',logo:r.logo||'',lbg:r.lbg||'light'};
  $('#form').innerHTML='<h2 id="dTitle">'+esc(n)+'</h2><p class="sub">מה הוא עושה – בבוקר ובצהריים</p>'+
    '<fieldset class="fs"><legend>'+I_AM+'בבוקר</legend>'+radios('amT',DRAFT.am.t)+'<input class="in" name="amD" value="'+esc(DRAFT.am.d||'')+'" placeholder="למשל: כולל ערב, או: מנהל חשבונות"></fieldset>'+
    '<fieldset class="fs"><legend>'+I_PM+'בצהריים</legend>'+radios('pmT',DRAFT.pm.t)+'<input class="in" name="pmD" value="'+esc(DRAFT.pm.d||'')+'" placeholder="מה ואיפה"></fieldset>'+
    '<fieldset class="fs"><legend>החברה / המקום</legend><input class="in" name="co" value="'+esc(DRAFT.co)+'" placeholder="שם החברה או המוסד">'+
    '<span class="lbl">תמונה / לוגו</span><div class="drop" id="drop" tabindex="0" role="button" aria-label="העלאת תמונה">'+logoBox()+'<p><b>לחצו או גררו לכאן תמונה</b><br>התמונה תמלא את כל הקובייה, והטקסט יופיע מעליה.</p></div>'+
    '<div class="bgopt">'+(DRAFT.logo?'<button type="button" class="btn danger" id="rmLogo">הסרת התמונה</button>':'')+'</div></fieldset>'+
    '<div class="row"><button class="btn" type="submit">שמירה</button><button class="btn ghost" type="button" data-close>ביטול</button></div>';
  openDlg('#dlg'); setTimeout(function(){ var i=$('#form input[name=amD]'); i&&i.focus(); },120);
}
function refreshLogo(){ var o=$('#dLogo'); if(o) o.outerHTML=logoBox(); var bg=$('.bgopt'); if(bg&&DRAFT.logo&&!$('#rmLogo')) bg.insertAdjacentHTML('beforeend','<button type="button" class="btn danger" id="rmLogo">הסרת התמונה</button>'); if(!DRAFT.logo&&$('#rmLogo')) $('#rmLogo').remove(); }
$('#form').addEventListener('change',function(e){ if(e.target.name==='lbg'){ DRAFT.lbg=e.target.value; refreshLogo(); } });
$('#form').addEventListener('click',function(e){
  if(e.target.closest('[data-close]')){ closeDlg('#dlg'); return; }
  if(e.target.closest('#rmLogo')){ DRAFT.logo=''; refreshLogo(); return; }
  if(e.target.closest('#drop')) $('#file').click(); });
$('#form').addEventListener('keydown',function(e){ if(e.target.id==='drop'&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); $('#file').click(); } });
$('#form').addEventListener('dragover',function(e){ var d=e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
$('#form').addEventListener('dragleave',function(e){ var d=e.target.closest('#drop'); if(d) d.classList.remove('over'); });
$('#form').addEventListener('drop',function(e){ var d=e.target.closest('#drop'); if(!d) return; e.preventDefault(); d.classList.remove('over'); var f=e.dataTransfer.files[0]; if(f) takeFile(f); });
$('#file').addEventListener('change',function(e){ var f=e.target.files[0]; e.target.value=''; if(f) takeFile(f); });
$('#form').addEventListener('submit',function(e){ e.preventDefault(); var fd=new FormData($('#form'));
  DRAFT.am={t:fd.get('amT')||'',d:String(fd.get('amD')||'').trim()}; DRAFT.pm={t:fd.get('pmT')||'',d:String(fd.get('pmD')||'').trim()}; DRAFT.co=String(fd.get('co')||'').trim();
  var r={}; if(DRAFT.am.t||DRAFT.am.d) r.am=DRAFT.am; if(DRAFT.pm.t||DRAFT.pm.d) r.pm=DRAFT.pm; if(DRAFT.co) r.co=DRAFT.co; if(DRAFT.logo){ r.logo=DRAFT.logo; r.lbg=DRAFT.lbg; }
  var prev=DATA[CUR]; if(Object.keys(r).length) DATA[CUR]=r; else delete DATA[CUR];
  if(!save()){ if(prev) DATA[CUR]=prev; else delete DATA[CUR]; return; }
  closeDlg('#dlg'); renderAll(); toast('נשמר ✓'); });

/* לוגו: חיתוך שוליים ריקים, הקטנה, שמירה */
function takeFile(f){
  if(!/^image\//.test(f.type)){ toast('זה לא קובץ תמונה'); return; }
  var url=URL.createObjectURL(f), img=new Image();
  img.onload=function(){ try{
    var W=img.naturalWidth, H=img.naturalHeight, sc=Math.min(1,900/Math.max(W,H)); W=Math.max(1,Math.round(W*sc)); H=Math.max(1,Math.round(H*sc));
    var c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d'); x.drawImage(img,0,0,W,H);
    var d=x.getImageData(0,0,W,H).data, bg=[d[0],d[1],d[2],d[3]];
    function diff(i){ if(bg[3]<20) return d[i+3]>20; if(d[i+3]<20) return true; return Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2])>48; }
    var x0=W,y0=H,x1=-1,y1=-1; for(var yy=0;yy<H;yy++) for(var xx=0;xx<W;xx++){ if(diff((yy*W+xx)*4)){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy; } }
    if(x1<0){ x0=0;y0=0;x1=W-1;y1=H-1; }
    var pad=Math.round(Math.max(x1-x0,y1-y0)*.04); x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(W-1,x1+pad); y1=Math.min(H-1,y1+pad);
    var cw=x1-x0+1, ch=y1-y0+1, s2=Math.min(1,800/Math.max(cw,ch)), o=document.createElement('canvas'); o.width=Math.round(cw*s2); o.height=Math.round(ch*s2);
    o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,o.width,o.height);
    var out=o.toDataURL('image/webp',.82); if(out.indexOf('data:image/webp')!==0) out=o.toDataURL('image/png');
    /* בחירה אוטומטית של רקע: לוגו בהיר על רקע כהה */
    var od=o.getContext('2d').getImageData(0,0,o.width,o.height).data, L=0, n=0; for(var i=0;i<od.length;i+=16){ if(od[i+3]>40){ L+=.3*od[i]+.59*od[i+1]+.11*od[i+2]; n++; } }
    if(bg[3]<20&&n) DRAFT.lbg=(L/n)>190?'dark':'light'; else DRAFT.lbg='light';
    DRAFT.logo=out; refreshLogo(); toast('התמונה נטענה');
  }catch(e){ toast('לא הצלחתי לקרוא את התמונה'); } URL.revokeObjectURL(url); };
  img.onerror=function(){ toast('לא הצלחתי לקרוא את התמונה'); URL.revokeObjectURL(url); };
  img.src=url;
}

/* ---------- גיבוי ---------- */
$('#dataBtn').addEventListener('click',function(){
  $('#box2').innerHTML='<h2 id="d2Title">גיבוי והעברת נתונים</h2><p class="sub">הנתונים נשמרים כרגע רק בדפדפן הזה. כאן אפשר להעתיק אותם (גם כדי להעביר אותם לאתר בהמשך) או להדביק גיבוי.</p>'+

/* ---------- חלונות ---------- */
var lastFocus=null;
function openDlg(s){ lastFocus=document.activeElement; $(s).classList.add('open'); document.body.style.overflow='hidden'; }
function closeDlg(s){ $(s).classList.remove('open'); if(!document.querySelector('.dlg.open')) document.body.style.overflow=''; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
[].forEach.call(document.querySelectorAll('.dlg'),function(d){ d.addEventListener('mousedown',function(e){ if(e.target===d) closeDlg('#'+d.id); }); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ var o=document.querySelector('.dlg.open'); if(o) closeDlg('#'+o.id); } });
var tt; function toast(t){ var el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){ el.classList.remove('on'); },2400); }

/* ---------- כותרת: אותיות קופצות ---------- */
(function(){
  var h=$('#title'), txt=h.textContent; h.innerHTML='';
  var C=[];
  txt.split(' ').forEach(function(word,wi){
    if(wi){ var sp=document.createElement('span'); sp.className='sp'; h.appendChild(sp); }
    var w=document.createElement('span'); w.className='w'; w.setAttribute('aria-hidden','true');
    Array.from(word).forEach(function(ch){ var s=document.createElement('span'); s.className='c'; s.textContent=ch; w.appendChild(s); C.push({el:s,y:0,vy:0,r:0,vr:0,s:1,vs:0,ty:0,tr:0,ts:1}); });
    h.appendChild(w);
  });
  if(reduce) return;
  var px=-9999, py=-9999, active=false;
  function move(e){ px=e.clientX; py=e.clientY; active=true; }
  h.addEventListener('pointermove',move); h.addEventListener('pointerdown',function(e){ move(e); C.forEach(function(c){ c.vy-=6*Math.random(); c.vr+=(Math.random()-.5)*10; }); });
  window.addEventListener('pointermove',function(e){ if(!h.contains(e.target)){ px=e.clientX; py=e.clientY; } });
  h.addEventListener('pointerleave',function(){ active=false; });
  /* אנימציית פתיחה: האותיות נוחתות */
  C.forEach(function(c,i){ c.y=-120-i*14; c.r=(i%2?1:-1)*25; c.s=.6; });
  function tick(){
    C.forEach(function(c,i){
      var b=c.el.getBoundingClientRect(), cx=b.left+b.width/2, cy=b.top+b.height/2, dx=px-cx, dy=py-cy, d=Math.sqrt(dx*dx+dy*dy), R=Math.max(90,b.width*1.6);
      var k=d<R?1-d/R:0; k=k*k*(3-2*k);
      c.ty=-k*b.height*.32; c.tr=(dx>0?-1:1)*k*16; c.ts=1+k*.32;
      c.el.classList.toggle('hot',k>.25);
      /* קפיץ */
      c.vy+=(c.ty-c.y)*.16; c.vy*=.72; c.y+=c.vy;
      c.vr+=(c.tr-c.r)*.14; c.vr*=.7; c.r+=c.vr;
      c.vs+=(c.ts-c.s)*.18; c.vs*=.68; c.s+=c.vs;
      c.el.style.transform='translateY('+c.y.toFixed(2)+'px) rotate('+c.r.toFixed(2)+'deg) scale('+c.s.toFixed(3)+','+(c.s*(1-(c.vy*.004))).toFixed(3)+')';
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ---------- רקע: רשת חיה שמגיבה למגע ---------- */
(function(){
  var cv=$('#bg'), x=cv.getContext('2d'), W,H,DPR, P=[], mouse={x:-9999,y:-9999,on:false}, waves=[];
  function size(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; x.setTransform(DPR,0,0,DPR,0,0);
    var n=Math.round(Math.min(90,Math.max(30,W*H/18000)));
    while(P.length<n) P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6,h:Math.random()});
    P.length=n; }
  size(); addEventListener('resize',size);
  addEventListener('pointermove',function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.on=true; },{passive:true});
  addEventListener('pointerdown',function(e){ waves.push({x:e.clientX,y:e.clientY,r:0}); mouse.x=e.clientX; mouse.y=e.clientY; mouse.on=true; },{passive:true});
  document.addEventListener('pointerleave',function(){ mouse.on=false; });
  addEventListener('touchend',function(){ setTimeout(function(){ mouse.on=false; },600); },{passive:true});
  var LINK=150;
  function frame(){
    x.clearRect(0,0,W,H);
    for(var w=waves.length-1;w>=0;w--){ var wv=waves[w]; wv.r+=7; var a=1-wv.r/420; if(a<=0){ waves.splice(w,1); continue; }
      x.beginPath(); x.arc(wv.x,wv.y,wv.r,0,6.283); x.strokeStyle='rgba(169,155,255,'+(a*.35)+')'; x.lineWidth=1; x.stroke(); }
    for(var i=0;i<P.length;i++){ var p=P[i];
      if(mouse.on){ var dx=mouse.x-p.x, dy=mouse.y-p.y, d2=dx*dx+dy*dy; if(d2<200*200){ var f=(1-Math.sqrt(d2)/200)*.035; p.vx+=dx*f*.02; p.vy+=dy*f*.02; } }
      waves.forEach(function(wv){ var dx=p.x-wv.x, dy=p.y-wv.y, d=Math.sqrt(dx*dx+dy*dy)||1; if(Math.abs(d-wv.r)<30){ p.vx+=dx/d*.6; p.vy+=dy/d*.6; } });
      p.vx*=.985; p.vy*=.985; var sp=Math.hypot(p.vx,p.vy); if(sp<.12){ p.vx+=(Math.random()-.5)*.05; p.vy+=(Math.random()-.5)*.05; } if(sp>2.4){ p.vx*=.9; p.vy*=.9; }
      p.x+=p.vx; p.y+=p.vy; if(p.x<-20) p.x=W+20; if(p.x>W+20) p.x=-20; if(p.y<-20) p.y=H+20; if(p.y>H+20) p.y=-20; }
    x.lineWidth=.8;
    for(i=0;i<P.length;i++){ var a1=P[i];
      for(var j=i+1;j<P.length;j++){ var b=P[j], ddx=a1.x-b.x, ddy=a1.y-b.y, dd=ddx*ddx+ddy*ddy; if(dd<LINK*LINK){ var o=(1-Math.sqrt(dd)/LINK)*.28; x.strokeStyle='rgba(150,140,255,'+o+')'; x.beginPath(); x.moveTo(a1.x,a1.y); x.lineTo(b.x,b.y); x.stroke(); } }
      if(mouse.on){ var mx=a1.x-mouse.x, my=a1.y-mouse.y, md=mx*mx+my*my; if(md<190*190){ var mo=(1-Math.sqrt(md)/190); x.strokeStyle='rgba(169,155,255,'+(mo*.45)+')'; x.beginPath(); x.moveTo(a1.x,a1.y); x.lineTo(mouse.x,mouse.y); x.stroke(); } }
    }
    for(i=0;i<P.length;i++){ var q=P[i]; x.beginPath(); x.arc(q.x,q.y,q.r,0,6.283); x.fillStyle='rgba(200,195,255,'+(q.h>.8?.8:.45)+')'; x.fill(); }
    if(mouse.on){ x.beginPath(); x.arc(mouse.x,mouse.y,3,0,6.283); x.fillStyle='rgba(169,155,255,.9)'; x.fill(); }
    if(!reduce) requestAnimationFrame(frame);
  }
  frame();
})();

renderAll();
})();
