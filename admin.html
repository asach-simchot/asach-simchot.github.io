<style>
:root{--bg:#F6EEDC;--card:#FFFBF2;--ink:#2A1E0E;--muted:#7C6A4F;--line:#E6D7B8;--wine:#7A1F1F;--wine2:#9C3030;--gold:#C49A3C;--gold2:#F0CF7C;--ok:#2E7D4F;--bad:#B23A2A;--warn:#B7791F;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,sans-serif;font-size:15px}
button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(160deg,#1A1206,#33240E 55%,#21170A);color:#F8EDD5;box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}
.top .in{max-width:1280px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.brand{font-family:"Frank Ruhl Libre",serif;font-size:22px;font-weight:900;color:var(--gold2);white-space:nowrap}
.brand small{display:block;font-family:Assistant;font-size:12px;font-weight:600;color:#CDB98F;letter-spacing:.3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:0;color:#E8D9B5;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700}
.tabs button[aria-current=true]{background:var(--gold2);color:#2B1E0D}
.tabs button:hover:not([aria-current=true]){background:rgba(240,207,124,.15)}
.tools{margin-inline-start:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:#CDB98F}
.tools button{background:rgba(240,207,124,.15);border:1px solid rgba(240,207,124,.4);color:#F8EDD5;border-radius:10px;padding:6px 12px;cursor:pointer}
main{max-width:1280px;margin:auto;padding:22px 20px 60px}
h2{font-family:"Frank Ruhl Libre",serif;font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-weight:600;font-size:13.5px}
.kpi.hl{background:linear-gradient(160deg,#7A1F1F,#5A1414);color:#FFF3DA;border:0}.kpi.hl span{color:#F3D9A7}
.two{grid-template-columns:2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.two,.three{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h3{margin:0 0 12px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:600;color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.bars .row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;padding:4px 0;font-size:14px}
.bars .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .trk{height:10px;background:#F0E5CC;border-radius:99px;overflow:hidden}.bars .trk i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--wine));border-radius:99px}
.bars .v{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:13px;min-width:48px;text-align:left}
.chart svg{width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#F3E8CF;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip.x{cursor:default}.chip button{background:none;border:0;color:var(--bad);cursor:pointer;padding:0 0 0 2px;font-weight:800}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:800;cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--card)}
th.s::after{content:" ▾"}th.s.up::after{content:" ▴"}
tbody tr{cursor:pointer}tbody tr:hover{background:#FBF3E2}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.tag.ok{background:#DFF1E6;color:var(--ok)}.tag.no{background:#F4E4DA;color:#8A4B2E}.tag.bad{background:#F8DCD6;color:var(--bad)}.tag.warn{background:#FBEBC9;color:var(--warn)}.tag.live{background:#2E9E52;color:#fff}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input[type=search],.f input,.f select{border:1px solid #D6C193;background:#fff;border-radius:10px;padding:8px 12px;min-width:0}
.bar input[type=search]{flex:1;min-width:200px}
.seg{display:inline-flex;background:#EFE3C7;border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--muted)}.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;background:var(--wine);color:#FFF6E2}
.btn.ghost{background:transparent;color:var(--wine);border:1px solid var(--wine)}.btn.sm{padding:4px 10px;font-size:13px}
.btn.gold{background:var(--gold2);color:#2B1E0D}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.f label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}.empty{color:var(--muted);padding:18px 0;text-align:center}
.scroll{max-height:560px;overflow:auto}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(20,14,6,.45);z-index:40}#scrim[hidden]{display:none}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(640px,100%);background:var(--bg);z-index:41;overflow:auto;box-shadow:20px 0 60px rgba(0,0,0,.3);transform:translateX(-102%);transition:transform .25s}
#drawer.open{transform:none}
#drawer .dh{position:sticky;top:0;background:linear-gradient(160deg,#7A1F1F,#5A1414);color:#FFF3DA;padding:18px 20px;display:flex;gap:12px;align-items:flex-start;z-index:2}
#drawer .dh h2{color:#FFF3DA;font-size:24px}#drawer .dh p{margin:2px 0 0;color:#F3D9A7;font-size:13.5px}
#drawer .dh .x{margin-inline-start:auto;background:rgba(255,255,255,.12);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
#drawer .db{padding:16px 20px;display:grid;gap:14px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.mini b{display:block;font-size:20px}.mini span{font-size:12px;color:var(--muted);font-weight:700}
@media(max-width:560px){.mini{grid-template-columns:repeat(2,1fr)}}
.tl .day{font-weight:800;margin:12px 0 6px;color:var(--wine);font-size:14px}
.tl .ev{display:grid;grid-template-columns:46px 22px 1fr;gap:6px;padding:4px 0;font-size:14px;border-bottom:1px dashed #EADCBF}
.tl .ev time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.tl .ev .who{font-weight:800}
.login{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}
.login input{width:100%;border:1px solid #C9AE77;border-radius:10px;padding:11px 12px;font-size:16px;margin:12px 0;direction:ltr}
.toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#2A1E0E;color:#F8EDD5;padding:10px 18px;border-radius:999px;z-index:60;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.loading{padding:60px;text-align:center;color:var(--muted);font-weight:700}
</style>
</head>

var DB={grads:[],extra:[],alias:[],block:[],sess:[],act:[],att:[]}, M={}, ST={tab:'overview',flt:'all',q:'',sort:'last',dir:-1,who:null,loadedAt:0};
async function all(table,sel,mod){ var out=[]; for(var f=0;;f+=1000){ var q=sb.from(table).select(sel||'*'); if(mod) q=mod(q); var r=await q.range(f,f+999); if(r.error) throw r.error; out=out.concat(r.data); if(r.data.length<1000) break; } return out; }

function build(){

function nameOf(who){ return (M[who]&&M[who].name)||who||'?'; }

function bars(obj,fmt,limit){ var arr=Object.keys(obj).map(function(k){ return [k,obj[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,limit||10); if(!arr.length) return '<div class="empty">אין עדיין נתונים</div>'; var mx=arr[0][1]||1;

function dayChart(){
  var days=[], map={}; for(var i=29;i>=0;i--){ var k=dayKey(Date.now()-i*864e5); days.push(k); map[k]={e:0,u:{}}; }

  days.forEach(function(k,i){ var v=map[k].e, u=Object.keys(map[k].u).length, h=v/mx*(H-14), x=W-(i+1)*bw+3; // RTL: today on the left

  return s+'<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9C3030"/><stop offset="1" stop-color="#C49A3C"/></linearGradient></defs></svg>';

function vOverview(){

document.addEventListener('click',async function(e){

function loginView(msg){
  $('#app').innerHTML='<div class="login"><h2>לוח בקרה</h2><p class="muted">כניסה למנהל האתר בלבד. הכניסו את המייל של המנהל ויישלח אליו קישור כניסה.</p><input type="email" id="em" placeholder="name@example.com" autocomplete="email"><button class="btn" id="go" style="width:100%">שליחת קישור</button><p id="lm" style="min-height:1.4em;font-weight:700">'+esc(msg||'')+'</p></div>';
  $('#go').onclick=async function(){ var em=$('#em').value.trim().toLowerCase(), lm=$('#lm'); if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ lm.textContent='כתובת מייל לא תקינה'; return; } lm.textContent='שולח…';
    var r=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});
    lm.textContent=r.error?'השליחה לא הצליחה: '+r.error.message:'נשלח! פתחו את המייל ולחצו על הקישור.'; };
}
(async function boot(){
  try{ if(HASH&&HASH.access_token) await sb.auth.setSession(HASH); }catch(e){}
  var s=(await sb.auth.getSession()).data.session;
  if(!s) return loginView(HASH&&HASH.err?'הקישור פג תוקף. בקשו קישור חדש.':'');
  var r=await sb.rpc('is_admin'); if(r.error||r.data!==true){ await sb.auth.signOut(); return loginView('המייל הזה אינו מוגדר כמנהל.'); }
  shell(); try{ await load(); }catch(e){ $('#main').innerHTML='<div class="card"><h3>לא ניתן לטעון את הנתונים</h3><p>'+esc(e.message||e)+'</p><p class="muted">האם הרצתם את קובץ ה-SQL ב-Supabase?</p></div>'; return; }
  render(); setInterval(function(){ if(!document.hidden) refresh(); },60000);
})();
})();
</script>
</body>
</html>
